<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/>
    </marker>
    <marker id="arrow3-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0ca678"/>
    </marker>
    <marker id="arrow3-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c92a2a"/>
    </marker>
    <marker id="arrow3-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e8590c"/>
    </marker>
  </defs>

  <text x="510" y="32" font-size="22" fill="#1971c2" text-anchor="middle" font-weight="600">Per-row Execution Flow</text>
  <text x="510" y="58" font-size="13" fill="#868e96" text-anchor="middle">Decision tree for a single eval row when gating scorers are present.</text>

  <!-- START: Row entry -->
  <rect x="420" y="90" width="180" height="48" rx="8" fill="#1864ab" stroke="#1864ab"/>
  <text x="510" y="120" font-size="14" fill="#f8f9fa" text-anchor="middle" font-weight="600">Row enters evaluator</text>

  <line x1="510" y1="138" x2="510" y2="166" stroke="#495057" stroke-width="2" fill="none" marker-end="url(#arrow3)"/>

  <!-- Decision 1: any gating scorer? -->
  <polygon points="510,170 640,222 510,274 380,222" fill="#fab005" stroke="#fab005" stroke-width="2"/>
  <text x="510" y="217" font-size="13" fill="#212529" text-anchor="middle" font-weight="600">any scorer with</text>
  <text x="510" y="235" font-size="13" fill="#212529" text-anchor="middle" font-weight="600">gate=True?</text>

  <!-- NO path: left to legacy parallel -->
  <line x1="380" y1="222" x2="280" y2="222" stroke="#495057" stroke-width="2" fill="none" marker-end="url(#arrow3)"/>
  <text x="330" y="214" font-size="12" fill="#868e96" text-anchor="middle" font-weight="700">NO</text>

  <rect x="20" y="194" width="260" height="56" rx="8" fill="#495057" fill-opacity="0.18" stroke="#495057" stroke-width="2"/>
  <text x="150" y="218" font-size="13" fill="#495057" text-anchor="middle" font-weight="600">Legacy parallel execution</text>
  <text x="150" y="238" font-size="11" fill="#495057" text-anchor="middle">All scorers via ThreadPoolExecutor</text>

  <!-- YES path: down to gate runner -->
  <line x1="510" y1="274" x2="510" y2="302" stroke="#0ca678" stroke-width="2" fill="none" marker-end="url(#arrow3-green)"/>
  <text x="530" y="292" font-size="12" fill="#0ca678" font-weight="700">YES</text>

  <!-- Stage: Run gates sequentially -->
  <rect x="340" y="306" width="340" height="56" rx="8" fill="#087f5b" fill-opacity="0.18" stroke="#087f5b" stroke-width="2"/>
  <text x="510" y="330" font-size="13" fill="#0ca678" text-anchor="middle" font-weight="600">Run gating scorers sequentially</text>
  <text x="510" y="350" font-size="11" fill="#495057" text-anchor="middle">Synchronous, in registration order</text>

  <line x1="510" y1="362" x2="510" y2="390" stroke="#495057" stroke-width="2" fill="none" marker-end="url(#arrow3)"/>

  <!-- Decision 2: gate result -->
  <polygon points="510,394 640,446 510,498 380,446" fill="#fab005" stroke="#fab005" stroke-width="2"/>
  <text x="510" y="441" font-size="13" fill="#212529" text-anchor="middle" font-weight="600">all gates</text>
  <text x="510" y="459" font-size="13" fill="#212529" text-anchor="middle" font-weight="600">returned pass?</text>

  <!-- YES branch (right): run LLM judges -->
  <line x1="640" y1="446" x2="780" y2="446" stroke="#0ca678" stroke-width="2" fill="none" marker-end="url(#arrow3-green)"/>
  <text x="710" y="438" font-size="12" fill="#0ca678" text-anchor="middle" font-weight="700">YES</text>

  <rect x="780" y="418" width="220" height="56" rx="8" fill="#c92a2a" fill-opacity="0.14" stroke="#c92a2a" stroke-width="2"/>
  <text x="890" y="442" font-size="13" fill="#c92a2a" text-anchor="middle" font-weight="600">Run LLM judges in parallel</text>
  <text x="890" y="462" font-size="11" fill="#495057" text-anchor="middle">ThreadPoolExecutor (current path)</text>

  <!-- NO branch (left): short-circuit -->
  <line x1="380" y1="446" x2="240" y2="446" stroke="#c92a2a" stroke-width="2" fill="none" marker-end="url(#arrow3-red)"/>
  <text x="310" y="438" font-size="12" fill="#c92a2a" text-anchor="middle" font-weight="700">NO</text>

  <rect x="20" y="418" width="220" height="56" rx="8" fill="#868e96" fill-opacity="0.18" stroke="#868e96" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="130" y="442" font-size="13" fill="#495057" text-anchor="middle" font-weight="600">Skip remaining scorers</text>
  <text x="130" y="462" font-size="11" fill="#495057" text-anchor="middle">Record skip Feedback per scorer</text>

  <!-- Gate-error branch (down): configurable -->
  <line x1="510" y1="498" x2="510" y2="538" stroke="#e8590c" stroke-width="2" fill="none" marker-end="url(#arrow3-orange)"/>
  <text x="540" y="522" font-size="12" fill="#e8590c" font-weight="700">if gate errored</text>

  <rect x="340" y="542" width="340" height="56" rx="8" fill="#e8590c" fill-opacity="0.18" stroke="#e8590c" stroke-width="2"/>
  <text x="510" y="566" font-size="13" fill="#e8590c" text-anchor="middle" font-weight="600">Configurable: fail-open or fail-closed</text>
  <text x="510" y="586" font-size="11" fill="#495057" text-anchor="middle">Default: fail-closed (treat as gate fail)</text>

  <!-- Converge to final telemetry+result -->
  <line x1="130" y1="474" x2="350" y2="640" stroke="#495057" stroke-width="2" fill="none" marker-end="url(#arrow3)"/>
  <line x1="890" y1="474" x2="670" y2="640" stroke="#495057" stroke-width="2" fill="none" marker-end="url(#arrow3)"/>
  <line x1="510" y1="598" x2="510" y2="640" stroke="#495057" stroke-width="2" fill="none" marker-end="url(#arrow3)"/>
  <line x1="150" y1="250" x2="370" y2="650" stroke="#495057" stroke-width="2" fill="none" marker-end="url(#arrow3)"/>

  <!-- Final block -->
  <rect x="330" y="648" width="360" height="56" rx="8" fill="#12b886" stroke="#12b886"/>
  <text x="510" y="672" font-size="14" fill="#212529" text-anchor="middle" font-weight="600">Emit telemetry + per-row Feedback</text>
  <text x="510" y="692" font-size="11" fill="#0b5345" text-anchor="middle">gates_triggered, llm_calls_skipped, gate_errors</text>
</svg>
