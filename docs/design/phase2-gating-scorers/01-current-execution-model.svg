<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 480" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/>
    </marker>
  </defs>

  <text x="510" y="32" font-size="22" fill="#1971c2" text-anchor="middle" font-weight="600">Current Execution Model (Phase 1)</text>
  <text x="510" y="58" font-size="13" fill="#868e96" text-anchor="middle">All scorers run in parallel for every row. Deterministic checks and LLM judges share the same ThreadPoolExecutor.</text>

  <!-- Eval data block -->
  <rect x="40" y="96" width="180" height="80" rx="8" fill="#1864ab" stroke="#1864ab"/>
  <text x="130" y="128" font-size="14" fill="#f8f9fa" text-anchor="middle" font-weight="600">eval_data row</text>
  <text x="130" y="148" font-size="12" fill="#dbe4ff" text-anchor="middle">inputs, outputs,</text>
  <text x="130" y="164" font-size="12" fill="#dbe4ff" text-anchor="middle">expectations, trace</text>

  <!-- Arrow into executor -->
  <line x1="220" y1="136" x2="280" y2="136" stroke="#495057" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- ThreadPoolExecutor container -->
  <rect x="300" y="96" width="500" height="280" rx="8" fill="#3b5bdb" fill-opacity="0.14" stroke="#3b5bdb" stroke-width="2"/>
  <text x="320" y="120" font-size="13" fill="#3b5bdb" font-weight="600">ThreadPoolExecutor (max_workers)</text>

  <!-- 5 scorers running concurrently -->
  <rect x="320" y="140" width="200" height="44" rx="6" fill="#087f5b" stroke="#087f5b"/>
  <text x="420" y="167" font-size="13" fill="#f8f9fa" text-anchor="middle" font-weight="600">JsonValidity (deterministic)</text>

  <rect x="540" y="140" width="240" height="44" rx="6" fill="#c92a2a" stroke="#c92a2a"/>
  <text x="660" y="167" font-size="13" fill="#f8f9fa" text-anchor="middle" font-weight="600">Correctness (LLM judge)</text>

  <rect x="320" y="200" width="200" height="44" rx="6" fill="#087f5b" stroke="#087f5b"/>
  <text x="420" y="227" font-size="13" fill="#f8f9fa" text-anchor="middle" font-weight="600">ContainsKeywords (deterministic)</text>

  <rect x="540" y="200" width="240" height="44" rx="6" fill="#c92a2a" stroke="#c92a2a"/>
  <text x="660" y="227" font-size="13" fill="#f8f9fa" text-anchor="middle" font-weight="600">Safety (LLM judge)</text>

  <rect x="320" y="260" width="200" height="44" rx="6" fill="#087f5b" stroke="#087f5b"/>
  <text x="420" y="287" font-size="13" fill="#f8f9fa" text-anchor="middle" font-weight="600">LengthBound (deterministic)</text>

  <rect x="540" y="260" width="240" height="44" rx="6" fill="#c92a2a" stroke="#c92a2a"/>
  <text x="660" y="287" font-size="13" fill="#f8f9fa" text-anchor="middle" font-weight="600">RetrievalGroundedness (LLM judge)</text>

  <!-- Cost annotation -->
  <text x="550" y="338" font-size="13" fill="#e8590c" font-weight="600" text-anchor="middle">All LLM scorers always run, even when deterministic checks fail.</text>
  <text x="550" y="358" font-size="12" fill="#868e96" text-anchor="middle">Cost example: 1000 rows x 5 LLM judges x $0.01 = $50/run, regardless of structural validity.</text>

  <!-- Arrow out -->
  <line x1="800" y1="222" x2="860" y2="222" stroke="#495057" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Results block -->
  <rect x="860" y="180" width="140" height="84" rx="8" fill="#12b886" stroke="#12b886"/>
  <text x="930" y="216" font-size="14" fill="#212529" text-anchor="middle" font-weight="600">Feedback</text>
  <text x="930" y="236" font-size="12" fill="#0b5345" text-anchor="middle">per scorer,</text>
  <text x="930" y="252" font-size="12" fill="#0b5345" text-anchor="middle">per row</text>

  <!-- Legend -->
  <rect x="40" y="408" width="20" height="20" rx="4" fill="#087f5b"/>
  <text x="68" y="423" font-size="12" fill="#495057">Deterministic (CODE)</text>
  <rect x="220" y="408" width="20" height="20" rx="4" fill="#c92a2a"/>
  <text x="248" y="423" font-size="12" fill="#495057">LLM judge (always called)</text>
  <rect x="450" y="408" width="20" height="20" rx="4" fill="#3b5bdb" fill-opacity="0.14" stroke="#3b5bdb" stroke-width="2"/>
  <text x="478" y="423" font-size="12" fill="#495057">Parallel execution pool</text>
</svg>
